version: "3.9"

services:
  postgres:
    container_name: db_chatbotllm
    image: postgres:latest
    environment:
      POSTGRES_USER: HiepData
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: db_chatbotllm
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata_chatbotllm:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    restart: unless-stopped

volumes:
  pgdata_chatbotllm:
