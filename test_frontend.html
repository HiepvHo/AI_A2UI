<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Chatbot - Test UI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .chat-container {
            height: 80vh;
            display: flex;
            flex-direction: column;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
        }
        
        .message {
            margin-bottom: 20px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user-message {
            background: #3b82f6;
            color: white;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 70%;
            margin-left: auto;
            word-wrap: break-word;
        }
        
        .bot-message {
            background: white;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            max-width: 85%;
        }
        
        .a2ui-block {
            margin: 12px 0;
        }
        
        .a2ui-card {
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid;
        }
        
        .a2ui-list {
            padding-left: 20px;
        }
        
        .crisis-alert {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        .sources {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.875rem;
        }
        
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3b82f6;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .input-container {
            border-top: 1px solid #e5e7eb;
            padding: 16px;
            background: white;
        }
        
        .chart-container {
            margin: 16px 0;
            background: white;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-4xl mx-auto p-4">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
            <h1 class="text-2xl font-bold text-gray-800">🤖 Emotion Chatbot</h1>
            <p class="text-sm text-gray-600">Test UI - Groq Llama 3.3 70B + RAG</p>
        </div>
        
        <!-- Chat Container -->
        <div class="chat-container bg-white rounded-lg shadow-sm">
            <!-- Messages -->
            <div id="messages" class="messages"></div>
            
            <!-- Input -->
            <div class="input-container">
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="Nhập câu hỏi của bạn..."
                        class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        onkeypress="handleKeyPress(event)"
                    />
                    <button 
                        onclick="sendMessage()"
                        class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium"
                    >
                        Gửi
                    </button>
                </div>
                
                <!-- Quick Actions -->
                <div class="flex gap-2 mt-3">
                    <button onclick="quickQuery('Toi cam thay buon va co don')" class="text-xs px-3 py-1 bg-gray-100 rounded-full hover:bg-gray-200">
                        💭 Tôi cảm thấy buồn
                    </button>
                    <button onclick="quickQuery('Cam xuc cua toi 7 ngay qua the nao?')" class="text-xs px-3 py-1 bg-gray-100 rounded-full hover:bg-gray-200">
                        📊 Thống kê 7 ngày
                    </button>
                    <button onclick="quickQuery('Cach de giam stress cong viec?')" class="text-xs px-3 py-1 bg-gray-100 rounded-full hover:bg-gray-200">
                        🧘 Giảm stress
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Footer Info -->
        <div class="mt-4 text-center text-sm text-gray-500">
            <p>Backend: <span class="font-mono text-blue-600">http://localhost:8000</span></p>
            <p>Model: Llama 3.3 70B | Embedding: e5-base | Vectors: 129 chunks</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/v1/chatbot/chat';
        const USER_ID = 1;
        let messageCount = 0;
        
        // Get or create session ID from localStorage
        function getSessionId() {
            let sessionId = localStorage.getItem('chatbot_session_id');
            if (!sessionId) {
                sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('chatbot_session_id', sessionId);
            }
            return sessionId;
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Quick query
        function quickQuery(query) {
            document.getElementById('userInput').value = query;
            sendMessage();
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            
            if (!query) return;
            
            // Clear input
            input.value = '';
            
            // Add user message
            addUserMessage(query);
            
            // Show loading
            const loadingId = showLoading();
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        user_id: USER_ID,
                        session_id: getSessionId()
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Remove loading
                removeLoading(loadingId);
                
                // Add bot response
                addBotMessage(data);
                
            } catch (error) {
                removeLoading(loadingId);
                addErrorMessage(error.message);
            }
        }

        // Add user message
        function addUserMessage(text) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `
                <div class="user-message">
                    ${escapeHtml(text)}
                </div>
            `;
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add bot message
        function addBotMessage(data) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.id = `message-${messageCount++}`;
            
            let html = '<div class="bot-message">';
            
            // Crisis alert
            if (data.crisis_detected) {
                html += `
                    <div class="crisis-alert">
                        ⚠️ CẢNH BÁO: Phát hiện dấu hiệu khủng hoảng!<br>
                        Vui lòng liên hệ đường dây nóng: 1900 0099 (24/7)
                    </div>
                `;
            }
            
            // A2UI Blocks
            if (data.a2ui_blocks && data.a2ui_blocks.length > 0) {
                data.a2ui_blocks.forEach(block => {
                    html += renderA2UIBlock(block, messageDiv.id);
                });
            } else if (data.answer) {
                // Fallback: plain text
                html += `<p class="text-gray-800 whitespace-pre-wrap">${escapeHtml(data.answer)}</p>`;
            }
            
            // Sources
            if (data.sources && data.sources.length > 0) {
                html += '<div class="sources">';
                html += '<div class="font-semibold text-gray-700 mb-2">📚 Nguồn tri thức:</div>';
                data.sources.forEach((source, idx) => {
                    const score = source.relevance_score || source.score || 0;
                    const category = source.category || 'Chung';
                    const title = source.title || source.source_file || 'Tài liệu';
                    html += `
                        <div class="text-gray-600 text-xs mb-1">
                            ${idx + 1}. <span class="font-medium">${escapeHtml(category)}</span> - ${escapeHtml(title)}
                            <span class="text-gray-500">(${(score * 100).toFixed(1)}%)</span>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            // Processing time
            if (data.processing_time) {
                html += `<div class="text-xs text-gray-400 mt-2">⏱️ ${data.processing_time.toFixed(2)}s</div>`;
            }
            
            html += '</div>';
            
            messageDiv.innerHTML = html;
            messagesDiv.appendChild(messageDiv);
            
            // Render charts after DOM insertion
            if (data.a2ui_blocks && data.a2ui_blocks.length > 0) {
                data.a2ui_blocks.forEach(block => {
                    if (block.type === 'chart' && block.spec) {
                        renderPlotlyChart(block);
                    }
                });
            }
            
            // Debug: Log response structure (enable by setting window.DEBUG_MODE = true in console)
            if (window.DEBUG_MODE) {
                console.log('Chatbot Response:', {
                    hasAnswer: !!data.answer,
                    a2uiBlocksCount: data.a2ui_blocks?.length || 0,
                    a2uiBlockTypes: data.a2ui_blocks?.map(b => b.type) || [],
                    sourcesCount: data.sources?.length || 0,
                    hasChart: !!data.chart_spec,
                    chartId: data.chart_id
                });
            }
            
            scrollToBottom();
        }

        // Render A2UI Block
        function renderA2UIBlock(block, messageId) {
            let html = '<div class="a2ui-block">';
            
            switch (block.type) {
                case 'text':
                    const textClass = block.style === 'heading' ? 'text-xl font-bold' : 
                                     block.style === 'subheading' ? 'text-lg font-semibold' :
                                     block.style === 'caption' ? 'text-sm text-gray-600' : '';
                    html += `<p class="${textClass} text-gray-800 whitespace-pre-wrap">${escapeHtml(block.content)}</p>`;
                    break;
                
                case 'card':
                    html += `
                        <div class="a2ui-card" style="border-left-color: ${block.color}; background: ${block.color}10;">
                            ${block.icon ? `<span class="text-2xl mb-2 block">${block.icon}</span>` : ''}
                            <div class="font-semibold text-gray-800 mb-1">${escapeHtml(block.title)}</div>
                            <div class="text-gray-700 text-sm">${escapeHtml(block.description)}</div>
                        </div>
                    `;
                    break;
                
                case 'list':
                    html += '<div class="a2ui-list">';
                    if (block.title) {
                        html += `<div class="font-semibold text-gray-800 mb-2">${escapeHtml(block.title)}</div>`;
                    }
                    const listTag = block.list_type === 'numbered' ? 'ol' : 'ul';
                    const listClass = block.list_type === 'numbered' ? 'list-decimal' : 'list-disc';
                    html += `<${listTag} class="${listClass} text-gray-700">`;
                    block.items.forEach(item => {
                        html += `<li class="mb-1">${escapeHtml(item)}</li>`;
                    });
                    html += `</${listTag}>`;
                    html += '</div>';
                    break;
                
                case 'chart':
                    html += `
                        <div class="chart-container">
                            ${block.title ? `<div class="font-semibold text-gray-800 mb-2">${escapeHtml(block.title)}</div>` : ''}
                            <div id="chart-${block.chart_id}" style="width: 100%; height: 400px;"></div>
                        </div>
                    `;
                    break;
                
                case 'button':
                    const btnClass = block.style === 'primary' ? 'bg-blue-600 text-white' :
                                    block.style === 'danger' ? 'bg-red-600 text-white' :
                                    'bg-gray-200 text-gray-800';
                    html += `
                        <button class="${btnClass} px-4 py-2 rounded-lg hover:opacity-80 transition-opacity">
                            ${escapeHtml(block.label)}
                        </button>
                    `;
                    break;
                
                case 'divider':
                    html += '<hr class="my-4 border-gray-200">';
                    break;
            }
            
            html += '</div>';
            return html;
        }

        // Render Plotly Chart
        function renderPlotlyChart(block) {
            setTimeout(() => {
                const chartDiv = document.getElementById(`chart-${block.chart_id}`);
                if (chartDiv && block.spec) {
                    try {
                        Plotly.newPlot(chartDiv, block.spec.data || [], block.spec.layout || {}, {
                            responsive: true,
                            displayModeBar: true
                        });
                    } catch (error) {
                        console.error('Plotly error:', error);
                        chartDiv.innerHTML = '<p class="text-red-600">Lỗi khi render biểu đồ</p>';
                    }
                }
            }, 100);
        }

        // Show loading
        function showLoading() {
            const messagesDiv = document.getElementById('messages');
            const loadingDiv = document.createElement('div');
            const loadingId = `loading-${Date.now()}`;
            loadingDiv.id = loadingId;
            loadingDiv.className = 'message';
            loadingDiv.innerHTML = `
                <div class="bot-message">
                    <div class="flex items-center gap-2">
                        <div class="loading"></div>
                        <div class="loading" style="animation-delay: 0.2s;"></div>
                        <div class="loading" style="animation-delay: 0.4s;"></div>
                        <span class="text-gray-500 text-sm ml-2">Đang suy nghĩ...</span>
                    </div>
                </div>
            `;
            messagesDiv.appendChild(loadingDiv);
            scrollToBottom();
            return loadingId;
        }

        // Remove loading
        function removeLoading(loadingId) {
            const loadingDiv = document.getElementById(loadingId);
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        // Add error message
        function addErrorMessage(error) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `
                <div class="bot-message">
                    <div class="text-red-600 font-semibold mb-2">❌ Lỗi kết nối</div>
                    <div class="text-gray-700 text-sm">${escapeHtml(error)}</div>
                    <div class="text-gray-600 text-xs mt-2">
                        Kiểm tra:
                        <ul class="list-disc ml-4 mt-1">
                            <li>Server đang chạy? (uvicorn backend.app:app)</li>
                            <li>Port 8000 đúng không?</li>
                            <li>CORS đã bật?</li>
                        </ul>
                    </div>
                </div>
            `;
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Scroll to bottom
        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Initialize
        window.onload = function() {
            document.getElementById('userInput').focus();
            
            // Welcome message
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = `
                <div class="message">
                    <div class="bot-message">
                        <h3 class="text-lg font-semibold text-gray-800 mb-2">👋 Xin chào!</h3>
                        <p class="text-gray-700 mb-3">
                            Tôi là chatbot hỗ trợ sức khỏe cảm xúc. Tôi có thể:
                        </p>
                        <ul class="list-disc ml-5 text-gray-700 mb-3">
                            <li>Lắng nghe và tư vấn về cảm xúc</li>
                            <li>Phân tích thống kê tâm trạng</li>
                            <li>Gợi ý cách giảm stress, lo âu</li>
                            <li>Phát hiện dấu hiệu khủng hoảng</li>
                        </ul>
                        <p class="text-gray-600 text-sm">
                            💡 Bạn có thể thử các câu hỏi mẫu bên dưới hoặc nhập câu hỏi của riêng bạn.
                        </p>
                    </div>
                </div>
            `;
        };
    </script>
</body>
</html>
